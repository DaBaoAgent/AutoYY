[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoyy"
version = "0.1.0"
description = "Documentary content workflow automation and deterministic quality gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.7"]
cover-local = ["Pillow>=10.4"]
asr-whisper = ["faster-whisper>=1.1"]
asr-funasr = ["funasr>=1.2"]

[project.scripts]
autoyy = "autoyy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
omit = ["*/autoyy/transcribe.py"]
